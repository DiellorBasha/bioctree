<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manifold Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { background: #1a1a1a; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  
  <!-- Three.js import map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import { init, loadModel } from './render.js';
    
    // Initialize scene
    init();
    
    // Get model URL from query parameter
    const urlParams = new URLSearchParams(window.location.search);
    const modelUrl = urlParams.get('model');
    
    if (modelUrl) {
      // Load model
      loadModel(modelUrl).catch(err => {
        console.error('Failed to load model:', err);
      });
    } else {
      console.warn('No model URL provided. Usage: viewer-embed.html?model=path/to/model.obj');
    }
  </script>
</body>
</html>
