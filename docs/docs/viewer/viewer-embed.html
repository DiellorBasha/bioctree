<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mesh Viewer</title>
  
  <style>
    body { 
      margin: 0; 
      overflow: hidden; 
      background: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #canvas-container { 
      width: 100vw; 
      height: 100vh; 
      position: relative;
    }
    #canvas { 
      width: 100%; 
      height: 100%; 
      display: block;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #666;
      font-size: 14px;
    }
    #error {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #d32f2f;
      font-size: 14px;
      display: none;
      text-align: center;
      max-width: 80%;
    }
  </style>

  <!-- Three.js via CDN with import maps -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <div id="canvas-container">
    <canvas id="canvas"></canvas>
    <div id="loading">Loading...</div>
    <div id="error"></div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

    // Parse URL parameters
    const params = new URLSearchParams(window.location.search);
    const modelUrl = params.get('model');
    const fieldUrl = params.get('field');

    // DOM elements
    const canvas = document.getElementById('canvas');
    const loading = document.getElementById('loading');
    const errorDiv = document.getElementById('error');

    // Scene setup
    let scene, camera, renderer, controls, mesh;

    function init() {
      // Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xf5f5f5);

      // Camera
      camera = new THREE.PerspectiveCamera(
        45,
        canvas.clientWidth / canvas.clientHeight,
        0.1,
        1000
      );
      camera.position.set(0, 0, 5);

      // Renderer
      renderer = new THREE.WebGLRenderer({ 
        canvas: canvas,
        antialias: true 
      });
      renderer.setSize(canvas.clientWidth, canvas.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio);

      // Lights
      const ambientLight = new THREE.AmbientLight(0x404040, 2);
      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
      directionalLight.position.set(1, 1, 1);
      scene.add(directionalLight);

      const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.5);
      directionalLight2.position.set(-1, -1, -1);
      scene.add(directionalLight2);

      // Controls
      controls = new OrbitControls(camera, canvas);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      // Handle window resize
      window.addEventListener('resize', onWindowResize);

      // Start animation loop
      animate();
    }

    function onWindowResize() {
      camera.aspect = canvas.clientWidth / canvas.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    function showError(message) {
      loading.style.display = 'none';
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
    }

    function hideLoading() {
      loading.style.display = 'none';
    }

    async function loadModel(url) {
      try {
        const ext = url.split('.').pop().toLowerCase();
        
        if (ext === 'glb' || ext === 'gltf') {
          // Load GLTF/GLB
          const loader = new GLTFLoader();
          const gltf = await new Promise((resolve, reject) => {
            loader.load(url, resolve, undefined, reject);
          });
          mesh = gltf.scene;
        } else if (ext === 'obj') {
          // Load OBJ
          const loader = new OBJLoader();
          mesh = await new Promise((resolve, reject) => {
            loader.load(url, resolve, undefined, reject);
          });
        } else {
          throw new Error(`Unsupported model format: ${ext}`);
        }

        // Add mesh to scene
        scene.add(mesh);

        // Center and scale mesh
        const box = new THREE.Box3().setFromObject(mesh);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        
        mesh.position.sub(center);
        
        const maxDim = Math.max(size.x, size.y, size.z);
        const scale = 2 / maxDim;
        mesh.scale.multiplyScalar(scale);

        // Position camera
        camera.position.z = 3;
        controls.target.set(0, 0, 0);
        controls.update();

        hideLoading();
      } catch (error) {
        showError(`Failed to load model: ${error.message}`);
        console.error(error);
      }
    }

    async function loadField(url) {
      try {
        const response = await fetch(url);
        const fieldData = await response.json();
        
        // Apply field data to mesh (colormap, etc.)
        // This will be implemented incrementally
        console.log('Field data loaded:', fieldData);
        
      } catch (error) {
        console.warn('Failed to load field data:', error);
      }
    }

    // Initialize viewer
    init();

    // Load model if URL provided
    if (modelUrl) {
      await loadModel(modelUrl);
      
      // Load field data if URL provided
      if (fieldUrl) {
        await loadField(fieldUrl);
      }
    } else {
      showError('No model URL provided. Add ?model=path/to/model.glb to URL');
    }
  </script>
</body>
</html>
