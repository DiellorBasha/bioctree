<!-- Simple D3 Scatter Plot -->
<html>
<head>
    <title>D3 Scatter Plot</title>
    <!-- Load custom CSS -->
    <link rel="stylesheet" href="d3_scatter_plot.css">
</head>
<body>
    <!-- The D3 chart will be rendered in this div -->
    <div class="chart-container"></div>
</body>

<!-- Load D3 library -->
<script src="./d3/d3.min.js"></script>

<!-- Load custom Javascript for scatter plot rendering -->
<script src="./d3_scatter_rendering.js"></script>

<script>
    // Define the required setup function
    function setup(htmlComponent) {
        // Get initial data from MATLAB
        var data = htmlComponent.Data;
        
        // Draw the scatter plot
        drawScatterPlot(data);
        
        // Specify a callback to re-draw the chart when Data changes
        htmlComponent.addEventListener("DataChanged", function(event) {
            var data = htmlComponent.Data;
            drawScatterPlot(data);
        });
    }
</script>
</html>
