    <html>
    <head>
        <title>D3 Population Pyramid</title>
        <!-- Load custom CSS -->
        <link rel="stylesheet" href="d3_population_pyramid.css">
    </head>
    <body>
        <!-- Add a custom title to display at the top of the page -->
        <h2 align=center id='title'></h2>

        <!-- The D3 chart will be rendered in this div -->
        <div class="chart-container"></div>
    </body>

    <!-- Load D3 library -->
    <script src="./d3/d3.min.js"></script>

    <!-- Load custom Javascript that we will use to render the D3 chart -->
    <!-- For this particular example, the code is in a separate JS file, but it also could be written below in a script tag -->
    <script src="./d3_chart_rendering.js"></script>

    <script>
        // Define the required setup function
        function setup(htmlComponent) {
            // Pass the required data to the drawD3Chart function to render to the chart at the beginning
            year = htmlComponent.Data.Year;
            populationCounts = htmlComponent.Data.PopulationCounts;

            // Use the drawD3Chart function defined within the d3_chart_rendering.js file
            drawD3Chart(year, populationCounts);
            
            // Specify a callback to re-draw the D3 chart
            // This callback gets executed when Data property of the uihtml component in MATLAB changes
            htmlComponent.addEventListener("DataChanged", function(event) {
                year = htmlComponent.Data.Year;
                populationCounts = htmlComponent.Data.PopulationCounts;
                drawD3Chart(year, populationCounts);
            });
        }
    </script>
    </html>
