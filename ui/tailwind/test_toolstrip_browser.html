<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toolstrip Browser Test</title>
  <link rel="stylesheet" href="./dist/bct-ui.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    body {
      padding: 20px;
    }
    .test-container {
      max-width: 1200px;
      margin: 0 auto;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .info-panel {
      padding: 20px;
      border-bottom: 1px solid;
    }
    .info-panel h1 {
      margin: 0 0 10px 0;
      font-size: 24px;
    }
    .info-panel p {
      margin: 5px 0;
    }
    .status {
      display: inline-block;
      padding: 4px 12px;
      background: #10b981;
      color: white;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="test-container">
    <div class="info-panel">
      <h1>🧪 Toolstrip Browser Test</h1>
      <p><span class="status">✓ CSS Loaded</span></p>
      <p>If you see styled buttons below with hover effects, Tailwind is working correctly.</p>
      <p>Open browser console (F12) to see button click messages.</p>
    </div>
    
    <!-- The actual toolstrip component -->
    <div id="toolstrip" class="w-full bg-light-bg-secondary dark:bg-dark-bg-secondary border-b border-light-border dark:border-dark-border">
      <div class="flex items-center px-2 py-1.5 gap-1">
        <!-- Logo -->
        <div class="flex items-center gap-2 px-3 mr-2">
          <div class="w-8 h-8 bg-bct-primary rounded-lg flex items-center justify-center text-white font-bold text-sm">
            BCT
          </div>
          <span class="font-semibold text-sm">Toolbox</span>
        </div>

        <!-- Button groups container -->
        <div id="button-groups" class="flex items-center gap-1 flex-1 overflow-x-auto scrollbar-hide">
          <!-- Will be populated by JS -->
        </div>

        <!-- Right actions -->
        <div class="flex items-center gap-1 ml-auto">
          <button id="theme-toggle" class="btn-icon" title="Toggle theme">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div style="padding: 20px;">
      <h2 style="margin: 0 0 10px 0;">Test Actions</h2>
      <button onclick="addTestGroups()" style="padding: 8px 16px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; margin-right: 8px;">
        Add Button Groups
      </button>
      <button onclick="testDisable()" style="padding: 8px 16px; background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer; margin-right: 8px;">
        Test Disable
      </button>
      <button onclick="clearAll()" style="padding: 8px 16px; background: #6b7280; color: white; border: none; border-radius: 4px; cursor: pointer;">
        Clear All
      </button>
      <div id="log" style="margin-top: 20px; padding: 10px; border: 1px solid; border-radius: 4px; font-family: monospace; font-size: 12px; min-height: 100px;">
        <div style="color: #10b981;">✓ Ready to test</div>
      </div>
    </div>
  </div>

  <script src="./dist/bct-ui.js"></script>
  <script>
    const log = document.getElementById('log');
    
    function logMessage(msg, type = 'info') {
      const color = type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : '#3b82f6';
      const div = document.createElement('div');
      div.style.color = color;
      div.textContent = msg;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    // Initialize the toolstrip
    const toolstripElement = document.getElementById('toolstrip');
    const buttonGroupsContainer = document.getElementById('button-groups');

    let buttonGroups = [];

    function addTestGroups() {
      clearAll();
      
      const groups = [
        {
          id: 'file',
          label: 'File',
          buttons: [
            { id: 'open', label: 'Open', icon: 'folder-open' },
            { id: 'save', label: 'Save', icon: 'save' },
            { id: 'export', label: 'Export', icon: 'download' }
          ]
        },
        {
          id: 'edit',
          label: 'Edit',
          buttons: [
            { id: 'undo', label: 'Undo', icon: 'undo' },
            { id: 'redo', label: 'Redo', icon: 'redo' },
            { id: 'copy', label: 'Copy', icon: 'copy' }
          ]
        },
        {
          id: 'view',
          label: 'View',
          buttons: [
            { id: 'zoomIn', label: 'Zoom In', icon: 'zoom-in' },
            { id: 'zoomOut', label: 'Zoom Out', icon: 'zoom-out' },
            { id: 'reset', label: 'Reset', icon: 'refresh' }
          ]
        }
      ];

      groups.forEach(group => {
        addGroup(group);
      });

      logMessage('✓ Added 3 button groups with 9 total buttons', 'success');
    }

    function addGroup(groupConfig) {
      buttonGroups.push(groupConfig);

      const groupDiv = document.createElement('div');
      groupDiv.className = 'flex items-center gap-1 px-2 border-r border-light-border dark:border-dark-border';
      groupDiv.id = `group-${groupConfig.id}`;

      // Group label
      const label = document.createElement('span');
      label.className = 'text-xs font-medium text-light-text-tertiary dark:text-dark-text-tertiary mr-2';
      label.textContent = groupConfig.label;
      groupDiv.appendChild(label);

      // Buttons container
      const buttonsContainer = document.createElement('div');
      buttonsContainer.className = 'flex items-center gap-1';

      groupConfig.buttons.forEach(btn => {
        const button = document.createElement('button');
        button.className = 'btn-icon flex items-center gap-1 px-3';
        button.id = `btn-${btn.id}`;
        button.title = btn.label;
        
        // Icon
        const iconDiv = document.createElement('div');
        iconDiv.className = 'w-5 h-5';
        iconDiv.innerHTML = `
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
          </svg>
        `;
        button.appendChild(iconDiv);
        
        // Label
        const labelSpan = document.createElement('span');
        labelSpan.className = 'text-xs';
        labelSpan.textContent = btn.label;
        button.appendChild(labelSpan);
        
        button.onclick = () => {
          logMessage(`🖱️ Button clicked: ${btn.label} (${btn.id})`, 'info');
        };
        buttonsContainer.appendChild(button);
      });

      groupDiv.appendChild(buttonsContainer);
      buttonGroupsContainer.appendChild(groupDiv);
    }

    function testDisable() {
      const saveBtn = document.getElementById('btn-save');
      if (saveBtn) {
        const isDisabled = saveBtn.disabled;
        saveBtn.disabled = !isDisabled;
        saveBtn.classList.toggle('opacity-50');
        logMessage(`${isDisabled ? '✓' : '⚠️'} Save button ${isDisabled ? 'enabled' : 'disabled'}`, isDisabled ? 'success' : 'error');
      } else {
        logMessage('⚠️ Add button groups first!', 'error');
      }
    }

    function clearAll() {
      buttonGroupsContainer.innerHTML = '';
      buttonGroups = [];
      logMessage('🗑️ Cleared all button groups', 'info');
    }

    // Theme toggle
    document.getElementById('theme-toggle').onclick = () => {
      document.documentElement.classList.toggle('dark');
      logMessage('🎨 Theme toggled', 'info');
    };

    logMessage('✓ Toolstrip initialized', 'success');
    logMessage('Click "Add Button Groups" to populate the toolbar', 'info');
  </script>
</body>
</html>
