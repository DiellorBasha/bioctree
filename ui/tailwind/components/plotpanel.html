<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCT Plot Panel</title>
  <link rel="stylesheet" href="../dist/bct-ui.css">
  <style>
    #plot-canvas {
      background: radial-gradient(circle at 50% 50%, 
        rgba(37, 99, 235, 0.05), 
        transparent 70%);
    }
  </style>
</head>
<body class="m-0 p-0 overflow-hidden h-screen">
  <div id="plotpanel" class="relative h-full w-full bg-light-bg-primary dark:bg-dark-bg-primary">
    <!-- Canvas/SVG container -->
    <div id="plot-canvas" class="absolute inset-0">
      <canvas id="canvas-2d" class="absolute inset-0 w-full h-full hidden"></canvas>
      <svg id="svg-layer" class="absolute inset-0 w-full h-full hidden">
        <g id="svg-content"></g>
      </svg>
      <div id="webgl-container" class="absolute inset-0 w-full h-full"></div>
    </div>

    <!-- Overlay controls (top-right) -->
    <div class="absolute top-4 right-4 flex flex-col gap-2">
      <div class="card p-2 shadow-lg">
        <div class="flex gap-1">
          <button class="mode-btn active" data-mode="rotate" title="Rotate view">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
          </button>
          <button class="mode-btn" data-mode="pan" title="Pan view">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11l5-5m0 0l5 5m-5-5v12"/>
            </svg>
          </button>
          <button class="mode-btn" data-mode="zoom" title="Zoom">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m3-3H7"/>
            </svg>
          </button>
          <button class="mode-btn" data-mode="select" title="Select">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"/>
            </svg>
          </button>
        </div>
      </div>

      <button id="reset-view" class="btn btn-secondary shadow-lg" title="Reset view">
        <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
        </svg>
        Reset
      </button>

      <button id="export-image" class="btn btn-secondary shadow-lg" title="Export image">
        <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
        </svg>
        Export
      </button>
    </div>

    <!-- Status bar (bottom) -->
    <div class="absolute bottom-0 left-0 right-0 bg-light-bg-secondary dark:bg-dark-bg-secondary border-t border-light-border dark:border-dark-border px-4 py-2">
      <div class="flex items-center justify-between text-xs">
        <div class="flex items-center gap-4">
          <span id="status-mode" class="font-medium">Mode: <span class="text-bct-primary">Rotate</span></span>
          <span id="status-coords" class="text-light-text-tertiary dark:text-dark-text-tertiary">X: 0.00, Y: 0.00</span>
        </div>
        <div class="flex items-center gap-4">
          <span id="status-vertices" class="text-light-text-tertiary dark:text-dark-text-tertiary">Vertices: 0</span>
          <span id="status-fps" class="text-light-text-tertiary dark:text-dark-text-tertiary">FPS: 0</span>
        </div>
      </div>
    </div>

    <!-- Loading overlay -->
    <div id="loading-overlay" class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
      <div class="card p-6 flex flex-col items-center gap-4">
        <div class="animate-spin-slow w-12 h-12 border-4 border-bct-primary border-t-transparent rounded-full"></div>
        <div class="text-sm font-medium">Loading visualization...</div>
      </div>
    </div>
  </div>

  <script src="../dist/bct-ui.js"></script>
  <script src="./plotpanel.js"></script>
</body>
</html>
