<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCT Toolstrip</title>
  <link rel="stylesheet" href="../dist/bct-ui.css">
</head>
<body class="m-0 p-0 overflow-hidden">
  <div id="toolstrip" class="w-full bg-light-bg-secondary dark:bg-dark-bg-secondary border-b border-light-border dark:border-dark-border">
    <!-- Main toolbar -->
    <div class="flex items-center px-2 py-1.5 gap-1">
      <!-- Logo/Title -->
      <div class="flex items-center gap-2 px-3 mr-2">
        <div class="w-8 h-8 bg-bct-primary rounded-lg flex items-center justify-center text-white font-bold text-sm">
          BCT
        </div>
        <span class="font-semibold text-sm hidden md:inline">Toolbox</span>
      </div>

      <!-- Button groups container -->
      <div id="button-groups" class="flex items-center gap-1 flex-1 overflow-x-auto scrollbar-hide">
        <!-- Button groups will be inserted here -->
      </div>

      <!-- Right actions -->
      <div class="flex items-center gap-1 ml-auto">
        <button id="theme-toggle" class="btn-icon" title="Toggle theme">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
          </svg>
        </button>
        <button id="settings-btn" class="btn-icon" title="Settings">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="../dist/bct-ui.js"></script>
  <script src="./toolstrip.js"></script>
  <script>
    // Setup MATLAB Data property listener
    function setupDataProperty() {
      let lastData = null;
      
      // Poll for Data property changes (MATLAB sets this)
      setInterval(function() {
        try {
          const data = window.Data;
          if (data && JSON.stringify(data) !== JSON.stringify(lastData)) {
            lastData = JSON.parse(JSON.stringify(data));
            
            // Call the BCT message handler if it exists
            if (typeof window.bctMessageHandler === 'function') {
              window.bctMessageHandler(data);
            }
          }
        } catch (e) {
          // Ignore errors
        }
      }, 50);
    }
    
    // Start polling when page loads
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', setupDataProperty);
    } else {
      setupDataProperty();
    }
  </script>
</body>
</html>
