<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCT Console</title>
  <link rel="stylesheet" href="../dist/bct-ui.css">
</head>
<body class="m-0 p-0 overflow-hidden h-screen flex flex-col">
  <div id="console" class="flex-1 flex flex-col bg-dark-bg-primary">
    <!-- Console header -->
    <div class="flex items-center justify-between px-4 py-2 bg-dark-bg-secondary border-b border-dark-border">
      <div class="flex items-center gap-2">
        <h3 class="text-sm font-semibold text-dark-text-primary">Console</h3>
        <div class="flex items-center gap-1">
          <button class="filter-btn active" data-level="all" title="All messages">
            <span class="badge badge-primary text-xs">All</span>
          </button>
          <button class="filter-btn" data-level="error" title="Errors">
            <span class="badge badge-error text-xs">Errors</span>
          </button>
          <button class="filter-btn" data-level="warning" title="Warnings">
            <span class="badge badge-warning text-xs">Warnings</span>
          </button>
          <button class="filter-btn" data-level="info" title="Info">
            <span class="badge badge-primary text-xs">Info</span>
          </button>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <button id="clear-btn" class="btn-icon p-1 text-dark-text-secondary hover:text-dark-text-primary" title="Clear console">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
        </button>
        <button id="export-btn" class="btn-icon p-1 text-dark-text-secondary hover:text-dark-text-primary" title="Export log">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Messages area -->
    <div id="messages" class="flex-1 overflow-y-auto p-4 font-mono text-sm space-y-1">
      <!-- Messages will be inserted here -->
    </div>

    <!-- Input area -->
    <div class="border-t border-dark-border bg-dark-bg-secondary p-2">
      <div class="flex items-center gap-2">
        <span class="text-bct-success font-mono text-sm">&gt;</span>
        <input 
          type="text" 
          id="command-input" 
          class="flex-1 bg-transparent border-none outline-none text-dark-text-primary font-mono text-sm placeholder:text-dark-text-tertiary"
          placeholder="Enter command..."
          autocomplete="off"
        />
        <button id="send-btn" class="btn-icon p-1 text-bct-primary" title="Send command">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="../dist/bct-ui.js"></script>
  <script src="./console.js"></script>
  <script>
    // Setup MATLAB Data property listener
    function setupDataProperty() {
      let lastData = null;
      
      // Poll for Data property changes (MATLAB sets this)
      setInterval(function() {
        try {
          const data = window.Data;
          if (data && JSON.stringify(data) !== JSON.stringify(lastData)) {
            lastData = JSON.parse(JSON.stringify(data));
            
            // Call the BCT message handler if it exists
            if (typeof window.bctMessageHandler === 'function') {
              window.bctMessageHandler(data);
            }
          }
        } catch (e) {
          // Ignore errors
        }
      }, 50);
    }
    
    // Start polling when page loads
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', setupDataProperty);
    } else {
      setupDataProperty();
    }
  </script>
</body>
</html>
