<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base Scrubber</title>
  <link rel="stylesheet" href="../dist/bct-ui.css">
</head>
<body class="bg-dark-bg-primary">
  
  <!-- Scrubber Container -->
  <div id="scrubber-container" class="w-full h-full p-4 flex flex-col">
    
    <!-- Header -->
    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-2">
        <span id="axis-label" class="text-sm font-medium text-dark-text-primary">Axis</span>
        <span id="domain-badge" class="badge badge-sm badge-info">Domain</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="btn-symmetric" class="btn-sm btn-ghost" title="Symmetric mode">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
          </svg>
        </button>
        <button id="btn-reset" class="btn-sm btn-ghost" title="Reset">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Main Scrubber Area -->
    <div class="flex-1 bg-dark-bg-secondary rounded-lg border border-dark-border p-4 flex flex-col">
      
      <!-- Kernel Visualization -->
      <div class="flex-1 mb-4 relative">
        <svg id="kernel-svg" class="w-full h-full" preserveAspectRatio="none">
          <!-- Gradient for kernel fill -->
          <defs>
            <linearGradient id="kernelGradient" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color:rgb(99, 102, 241);stop-opacity:0.8" />
              <stop offset="100%" style="stop-color:rgb(99, 102, 241);stop-opacity:0.2" />
            </linearGradient>
          </defs>
          
          <!-- Kernel curve path -->
          <path id="kernel-path" fill="url(#kernelGradient)" stroke="rgb(99, 102, 241)" stroke-width="2"/>
          
          <!-- Center line -->
          <line id="center-line" stroke="rgb(139, 92, 246)" stroke-width="2" stroke-dasharray="4,4"/>
          
          <!-- Left/Right region indicators (for asymmetric mode) -->
          <line id="left-line" stroke="rgb(239, 68, 68)" stroke-width="2" stroke-dasharray="2,2" opacity="0"/>
          <line id="right-line" stroke="rgb(239, 68, 68)" stroke-width="2" stroke-dasharray="2,2" opacity="0"/>
        </svg>
        
        <!-- Interactive overlay for click-to-set -->
        <div id="click-overlay" class="absolute inset-0 cursor-crosshair"></div>
      </div>

      <!-- Scrubber Track -->
      <div class="relative h-16 bg-dark-bg-tertiary rounded-lg border border-dark-border">
        
        <!-- Axis ticks and labels -->
        <div id="axis-ticks" class="absolute inset-x-0 bottom-0 h-8 flex items-end justify-between px-2 text-xs text-dark-text-tertiary">
          <span id="tick-min">0</span>
          <span id="tick-mid">50</span>
          <span id="tick-max">100</span>
        </div>
        
        <!-- Selection region -->
        <div id="selection-region" class="absolute top-2 h-8 bg-bct-primary bg-opacity-20 border-2 border-bct-primary rounded transition-all duration-100">
          
          <!-- Left handle (asymmetric mode only) -->
          <div id="left-handle" class="absolute left-0 top-0 h-full w-3 bg-bct-primary rounded-l cursor-ew-resize opacity-0 hover:bg-bct-primary-hover transition-colors"
               title="Drag to adjust left boundary">
            <div class="w-0.5 h-4 bg-white mx-auto my-2 rounded"></div>
          </div>
          
          <!-- Center knob (always visible) -->
          <div id="center-knob" class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-8 h-8 bg-bct-primary rounded-full border-4 border-dark-bg-primary cursor-grab active:cursor-grabbing shadow-lg hover:scale-110 transition-transform"
               title="Drag to move window">
            <div class="absolute inset-0 flex items-center justify-center">
              <div class="w-2 h-2 bg-white rounded-full"></div>
            </div>
          </div>
          
          <!-- Right handle (asymmetric mode only) -->
          <div id="right-handle" class="absolute right-0 top-0 h-full w-3 bg-bct-primary rounded-r cursor-ew-resize opacity-0 hover:bg-bct-primary-hover transition-colors"
               title="Drag to adjust right boundary">
            <div class="w-0.5 h-4 bg-white mx-auto my-2 rounded"></div>
          </div>
        </div>
      </div>

      <!-- Value displays -->
      <div class="flex items-center justify-between mt-3 text-sm">
        <div class="flex items-center gap-4">
          <div>
            <span class="text-dark-text-tertiary">Center:</span>
            <span id="value-center" class="ml-1 font-mono text-dark-text-primary">0.00</span>
          </div>
          <div>
            <span class="text-dark-text-tertiary">Width:</span>
            <span id="value-width" class="ml-1 font-mono text-dark-text-primary">0.00</span>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-dark-text-tertiary text-xs">Scroll to adjust width</span>
          <svg class="w-3 h-3 text-dark-text-tertiary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19V5m0 14l-4-4m4 4l4-4"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Kernel Shape Selector -->
    <div class="mt-4 flex items-center gap-2">
      <span class="text-sm text-dark-text-tertiary">Kernel:</span>
      <select id="kernel-shape" class="input input-sm flex-1">
        <option value="gaussian">Gaussian</option>
        <option value="rectangular">Rectangular</option>
        <option value="triangular">Triangular</option>
        <option value="hamming">Hamming</option>
        <option value="hann">Hann</option>
        <option value="tukey">Tukey</option>
      </select>
    </div>
  </div>

  <!-- Tooltip -->
  <div id="tooltip" class="fixed hidden bg-dark-bg-primary border border-dark-border rounded px-2 py-1 text-xs text-dark-text-primary shadow-lg pointer-events-none z-50">
    <span id="tooltip-text"></span>
  </div>

  <script>
    // Setup MATLAB Data property listener
    function setupDataProperty() {
      let lastData = null;
      
      setInterval(function() {
        try {
          const data = window.Data;
          if (data && JSON.stringify(data) !== JSON.stringify(lastData)) {
            lastData = JSON.parse(JSON.stringify(data));
            
            if (typeof window.bctMessageHandler === 'function') {
              window.bctMessageHandler(data);
            }
          }
        } catch (e) {
          // Ignore errors
        }
      }, 50);
    }
    
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', setupDataProperty);
    } else {
      setupDataProperty();
    }
  </script>

</body>
</html>
