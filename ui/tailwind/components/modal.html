<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCT Modal</title>
  <link rel="stylesheet" href="../dist/bct-ui.css">
</head>
<body class="m-0 p-0">
  <!-- Modal overlay (hidden by default) -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal-content" class="modal-content">
      <!-- Modal header -->
      <div class="modal-header flex items-center justify-between">
        <h3 id="modal-title" class="text-lg font-semibold">Modal Title</h3>
        <button id="modal-close" class="btn-icon p-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Modal body -->
      <div id="modal-body" class="modal-body">
        <p class="text-light-text-secondary dark:text-dark-text-secondary">
          Modal content goes here.
        </p>
      </div>

      <!-- Modal footer -->
      <div id="modal-footer" class="modal-footer">
        <button id="modal-cancel" class="btn btn-secondary">Cancel</button>
        <button id="modal-confirm" class="btn btn-primary">Confirm</button>
      </div>
    </div>
  </div>

  <script src="../dist/bct-ui.js"></script>
  <script src="./modal.js"></script>
  <script>
    // Setup MATLAB Data property listener
    function setupDataProperty() {
      let lastData = null;
      
      // Poll for Data property changes (MATLAB sets this)
      setInterval(function() {
        try {
          const data = window.Data;
          if (data && JSON.stringify(data) !== JSON.stringify(lastData)) {
            lastData = JSON.parse(JSON.stringify(data));
            
            // Call the BCT message handler if it exists
            if (typeof window.bctMessageHandler === 'function') {
              window.bctMessageHandler(data);
            }
          }
        } catch (e) {
          // Ignore errors
        }
      }, 50);
    }
    
    // Start polling when page loads
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', setupDataProperty);
    } else {
      setupDataProperty();
    }
  </script>
</body>
</html>
