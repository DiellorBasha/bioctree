<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base Scrubber (D3)</title>
  <link rel="stylesheet" href="../dist/bct-ui.css">
</head>
<body class="bg-dark-bg-primary">
  
  <!-- Scrubber Container -->
  <div id="scrubber-container" class="w-full h-full p-4 flex flex-col">
    
    <!-- Header -->
    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-2">
        <span id="axis-label" class="text-sm font-medium text-dark-text-primary">Axis</span>
        <span id="domain-badge" class="badge badge-sm badge-info">Domain</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="btn-symmetric" class="btn-sm btn-ghost" title="Symmetric mode">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
          </svg>
        </button>
        <button id="btn-reset" class="btn-sm btn-ghost" title="Reset">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Main Scrubber Area -->
    <div class="flex-1 bg-dark-bg-secondary rounded-lg border border-dark-border p-4 flex flex-col">
      
      <!-- Kernel Visualization -->
      <div class="flex-1 mb-4 relative">
        <svg id="kernel-svg" class="w-full h-full" preserveAspectRatio="none">
          <!-- Gradient for kernel fill -->
          <defs>
            <linearGradient id="kernelGradient" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color:rgb(99, 102, 241);stop-opacity:0.8" />
              <stop offset="100%" style="stop-color:rgb(99, 102, 241);stop-opacity:0.2" />
            </linearGradient>
          </defs>
          
          <!-- Kernel curve path -->
          <path id="kernel-path" fill="url(#kernelGradient)" stroke="rgb(99, 102, 241)" stroke-width="2"/>
          
          <!-- Center line -->
          <line id="center-line" stroke="rgb(239, 68, 68)" stroke-width="2" opacity="0.8"/>
          
          <!-- Left/right boundary lines (asymmetric mode) -->
          <line id="left-line" stroke="rgb(234, 179, 8)" stroke-width="1.5" stroke-dasharray="4,2" opacity="0"/>
          <line id="right-line" stroke="rgb(234, 179, 8)" stroke-width="1.5" stroke-dasharray="4,2" opacity="0"/>
        </svg>
      </div>

      <!-- Scrubber Track -->
      <div class="relative h-12 bg-dark-bg-tertiary rounded-lg border border-dark-border mb-4">
        <!-- Click overlay for quick center positioning -->
        <div id="click-overlay" class="absolute inset-0 cursor-pointer"></div>
        
        <!-- Selection region -->
        <div id="selection-region" class="absolute h-full bg-bct-primary bg-opacity-20 border-l-2 border-r-2 border-bct-primary rounded pointer-events-none">
          <!-- Center knob -->
          <div id="center-knob" class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-6 h-6 bg-bct-primary rounded-full cursor-grab shadow-lg pointer-events-auto"></div>
          
          <!-- Left handle (asymmetric mode) -->
          <div id="left-handle" class="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-1/2 w-4 h-4 bg-yellow-500 rounded-full cursor-ew-resize shadow-md pointer-events-auto opacity-0"></div>
          
          <!-- Right handle (asymmetric mode) -->
          <div id="right-handle" class="absolute right-0 top-1/2 -translate-y-1/2 translate-x-1/2 w-4 h-4 bg-yellow-500 rounded-full cursor-ew-resize shadow-md pointer-events-auto opacity-0"></div>
        </div>
      </div>

      <!-- Axis ticks -->
      <div class="flex justify-between text-xs text-dark-text-secondary mb-3">
        <span id="tick-min">0</span>
        <span id="tick-mid">50</span>
        <span id="tick-max">100</span>
      </div>

      <!-- Controls -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-4">
          <div class="flex items-center gap-2">
            <span class="text-xs text-dark-text-secondary">Center:</span>
            <span id="value-center" class="text-sm font-medium text-dark-text-primary">50.00</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-xs text-dark-text-secondary">Width:</span>
            <span id="value-width" class="text-sm font-medium text-dark-text-primary">20.00</span>
          </div>
        </div>
        
        <div class="flex items-center gap-2">
          <label class="text-xs text-dark-text-secondary">Kernel:</label>
          <select id="kernel-shape" class="input input-sm w-32">
            <option value="gaussian">Gaussian</option>
            <option value="rectangular">Rectangular</option>
            <option value="triangular">Triangular</option>
            <option value="hamming">Hamming</option>
            <option value="hann">Hann</option>
            <option value="tukey">Tukey</option>
          </select>
        </div>
      </div>
    </div>

  </div>

  <!-- Load BCT UI Library (includes D3.js and all components) -->
  <script src="../dist/bct-ui.js"></script>
  
  <!-- Initialize BaseScrubber -->
  <script>
    (function() {
      'use strict';
      
      // Initialize scrubber when DOM is ready
      function initializeScrubber() {
        try {
          // Create scrubber instance using BCT global namespace
          window.scrubberInstance = new BCT.BaseScrubber('#scrubber-container', {
            min: 0,
            max: 100,
            center: 50,
            width: 20,
            label: 'Axis',
            domain: 'generic',
            kernelShape: 'gaussian'
          });
          
          console.log('[Scrubber] Initialized successfully with D3.js v' + BCT.version);
        } catch (error) {
          console.error('[Scrubber] Initialization failed:', error);
        }
      }
      
      // Setup MATLAB Data property listener
      function setupDataProperty() {
        let lastData = null;
        
        // Poll for Data property changes (MATLAB sets this)
        setInterval(function() {
          try {
            const data = window.Data;
            if (data && JSON.stringify(data) !== JSON.stringify(lastData)) {
              lastData = JSON.parse(JSON.stringify(data));
              
              // Forward to scrubber instance
              if (window.scrubberInstance && window.scrubberInstance.handleMatlabMessage) {
                window.scrubberInstance.handleMatlabMessage(data);
              }
            }
          } catch (e) {
            // Ignore errors
          }
        }, 50);
      }
      
      // Initialize when DOM is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
          initializeScrubber();
          setupDataProperty();
        });
      } else {
        initializeScrubber();
        setupDataProperty();
      }
    })();
  </script>

</body>
</html>
