<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Three Mesh Viewer</title>
  <link rel="stylesheet" href="./styles.css" />

  <!-- Import map: match official three.js pattern (three + three/addons) -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <div id="root">
    <canvas id="canvas"></canvas>
  </div>

  <!-- MATLAB Bridge: setup function for uihtml communication -->
  <script type="module">
    import { initViewer, setMeshFromData, setScalarData } from "./render.js";

    /**
     * Install console forwarding bridge to MATLAB
     * Intercepts console.log/warn/error and forwards to MATLAB via sendEventToMATLAB
     */
    function installConsoleBridge(htmlComponent) {
      const levels = ["log", "info", "warn", "error", "debug"];

      // Helper: stringify safely
      const toString = (x) => {
        if (typeof x === "string") return x;
        try { return JSON.stringify(x); } catch { return String(x); }
      };

      levels.forEach((level) => {
        const original = console[level].bind(console);

        console[level] = (...args) => {
          // Keep normal browser console behavior
          original(...args);

          // Forward to MATLAB
          try {
            const payload = {
              level,
              time: new Date().toISOString(),
              msg: args.map(toString).join(" "),
            };
            htmlComponent.sendEventToMATLAB("JSConsole", payload);
          } catch (e) {
            // Avoid infinite recursion: do not console.error here
          }
        };
      });

      // Forward uncaught errors
      window.addEventListener("error", (event) => {
        try {
          htmlComponent.sendEventToMATLAB("JSConsole", {
            level: "error",
            time: new Date().toISOString(),
            msg: `${event.message} @ ${event.filename}:${event.lineno}:${event.colno}`,
          });
        } catch {}
      });

      // Forward unhandled promise rejections
      window.addEventListener("unhandledrejection", (event) => {
        try {
          htmlComponent.sendEventToMATLAB("JSConsole", {
            level: "error",
            time: new Date().toISOString(),
            msg: `UnhandledPromiseRejection: ${toString(event.reason)}`,
          });
        } catch {}
      });

      console.log('[Console Bridge] Installed - forwarding to MATLAB');
    }

    // Global setup function for MATLAB uihtml component
    window.setup = function(htmlComponent) {
      console.log('[MATLAB Bridge] setup() called by MATLAB');
      
      // Install console forwarding FIRST
      installConsoleBridge(htmlComponent);
      
      const canvas = document.getElementById("canvas");
      const hud = document.getElementById("hud");

      // Initialize viewer without loading a mesh
      initViewer({ canvasEl: canvas, hudEl: hud, glbUrl: null })
        .then(() => {
          console.log('[MATLAB Bridge] Viewer initialized, ready for data');
        })
        .catch((err) => {
          console.error('[MATLAB Bridge] Viewer initialization failed:', err);
        });

      // Listen for data changes from MATLAB
      htmlComponent.addEventListener("DataChanged", (event) => {
        console.log('[MATLAB Bridge] DataChanged event received');
        const data = htmlComponent.Data;

        // Check if mesh data is present
        if (data && data.mesh) {
          console.log('[MATLAB Bridge] Loading mesh from MATLAB data');
          setMeshFromData(data.mesh);
        }
        
        // Check if scalar data is present
        if (data && data.scalar) {
          console.log('[MATLAB Bridge] Loading scalar data from MATLAB');
          setScalarData(data.scalar);
        }
      });
    };
  </script>

  <script type="module" src="./main.js"></script>
</body>
</html>
