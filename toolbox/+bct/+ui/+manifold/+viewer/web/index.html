<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Three Mesh Viewer</title>
  <link rel="stylesheet" href="./styles.css" />
  <!-- Loader component styles -->
  <link rel="stylesheet" href="./ui/loading-indicators/spinning/spinning.css" />

  <!-- Import map: match official three.js pattern (three + three/addons) -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <div id="root">
    <canvas id="canvas"></canvas>

    <div id="loaderOverlay" class="loaderOverlay hidden">
      <div id="loaderHost"></div>
    </div>

    <div id="pickerHUD" class="pickerHUD">
      <button id="btnPickVertex" class="toolBtn" type="button">Vertex</button>
      <button id="btnPickEdge" class="toolBtn" type="button">Edge</button>
      <button id="btnPickFace" class="toolBtn" type="button">Face</button>
    </div>

    <div id="hud">
      <div id="hudFileSelector">
        <select id="fileSelect">
          <option value="./assets/fsaverage.glb">fsaverage.glb</option>
          <option value="./assets/fsaverage.json">fsaverage.json</option>
        </select>
        <button id="btnLoad" type="button">Load</button>
      </div>
      <div id="hudText"></div>
    </div>
  </div>

  <!-- MATLAB Bridge: setup function for uihtml communication -->
  <script type="module">
    import { initViewer, setMeshFromData } from "./render.js";

    // Global setup function for MATLAB uihtml component
    window.setup = function(htmlComponent) {
      console.log('[MATLAB Bridge] setup() called by MATLAB');
      
      const canvas = document.getElementById("canvas");
      const hud = document.getElementById("hud");

      // Initialize viewer without loading a mesh
      initViewer({ canvasEl: canvas, hudEl: hud, glbUrl: null })
        .then(() => {
          console.log('[MATLAB Bridge] Viewer initialized, ready for data');
        })
        .catch((err) => {
          console.error('[MATLAB Bridge] Viewer initialization failed:', err);
        });

      // Listen for data changes from MATLAB
      htmlComponent.addEventListener("DataChanged", (event) => {
        console.log('[MATLAB Bridge] DataChanged event received');
        const data = htmlComponent.Data;
        console.log('[MATLAB Bridge] Data:', data);

        // Check if mesh data is present
        if (data && data.mesh) {
          console.log('[MATLAB Bridge] Loading mesh from MATLAB data');
          setMeshFromData(data.mesh);
        }
      });
    };
  </script>

  <script type="module" src="./main.js"></script>
</body>
</html>
