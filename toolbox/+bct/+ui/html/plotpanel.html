<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCT Plot Panel</title>
    <link rel="stylesheet" href="../css/bct-common.css">
    <link rel="stylesheet" href="../css/plotpanel.css">
</head>
<body>
    <div id="bct-plotpanel" class="bct-component bct-plotpanel">
        <!-- Toolbar -->
        <div class="plotpanel-toolbar">
            <div class="plotpanel-toolbar-group">
                <button class="bct-btn-icon" id="btn-rotate" title="Rotate" data-mode="rotate">🔄</button>
                <button class="bct-btn-icon" id="btn-pan" title="Pan" data-mode="pan">✋</button>
                <button class="bct-btn-icon" id="btn-zoom" title="Zoom" data-mode="zoom">🔍</button>
            </div>
            <div class="plotpanel-toolbar-group">
                <button class="bct-btn-icon" id="btn-reset" title="Reset View">🏠</button>
                <button class="bct-btn-icon" id="btn-export" title="Export Image">📷</button>
            </div>
            <div class="plotpanel-toolbar-group">
                <button class="bct-btn-icon" id="btn-clear" title="Clear">🗑️</button>
            </div>
        </div>
        
        <!-- Canvas container -->
        <div class="plotpanel-canvas-container" id="canvas-container">
            <canvas id="plotpanel-canvas"></canvas>
            <div class="plotpanel-overlay" id="plotpanel-overlay">
                <div class="plotpanel-loading" id="plotpanel-loading">
                    <span>Loading...</span>
                </div>
                <div class="plotpanel-empty" id="plotpanel-empty">
                    <span>No data to display</span>
                </div>
            </div>
        </div>
        
        <!-- Status bar -->
        <div class="plotpanel-statusbar" id="statusbar">
            <span class="plotpanel-status-item" id="status-type">Type: None</span>
            <span class="plotpanel-status-item" id="status-vertices">Vertices: 0</span>
            <span class="plotpanel-status-item" id="status-faces">Faces: 0</span>
            <span class="plotpanel-status-item" id="status-mode">Mode: Rotate</span>
        </div>
    </div>

    <script src="../js/bct-common.js"></script>
    <script src="../js/plotpanel.js"></script>
</body>
</html>
