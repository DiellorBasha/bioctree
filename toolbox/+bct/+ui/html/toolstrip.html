<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCT Toolstrip</title>
    <link rel="stylesheet" href="../css/bct-common.css">
    <link rel="stylesheet" href="../css/toolstrip.css">
</head>
<body>
    <div id="bct-toolstrip" class="bct-component bct-toolstrip">
        <!-- Button groups will be dynamically populated -->
        <div id="toolstrip-groups" class="toolstrip-groups"></div>
        
        <!-- Right-side controls (optional) -->
        <div class="toolstrip-right">
            <button class="bct-btn bct-btn-icon" id="btn-settings" title="Settings">
                ⚙️
            </button>
        </div>
    </div>

    <script src="../js/bct-common.js"></script>
    <script src="../js/toolstrip.js"></script>
</body>
</html>
