<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCT Sidebar</title>
    <link rel="stylesheet" href="../css/bct-common.css">
    <link rel="stylesheet" href="../css/sidebar.css">
</head>
<body>
    <div id="bct-sidebar" class="bct-component bct-sidebar">
        <!-- Toggle button -->
        <button class="sidebar-toggle" id="sidebar-toggle" title="Toggle Sidebar">
            ◀
        </button>
        
        <!-- Sidebar content -->
        <div class="sidebar-content" id="sidebar-content">
            <div class="sidebar-header">
                <h3 class="sidebar-title">Controls</h3>
            </div>
            
            <div class="sidebar-sections" id="sidebar-sections">
                <!-- Sections will be dynamically populated -->
            </div>
        </div>
    </div>

    <script src="../js/bct-common.js"></script>
    <script src="../js/sidebar.js"></script>
</body>
</html>
