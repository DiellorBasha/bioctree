<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCT Console</title>
    <link rel="stylesheet" href="../css/bct-common.css">
    <link rel="stylesheet" href="../css/console.css">
</head>
<body>
    <div id="bct-console" class="bct-component bct-console">
        <!-- Console header with controls -->
        <div class="console-header">
            <h3 class="console-title">Console</h3>
            <div class="console-controls">
                <select id="filter-level" class="bct-select console-filter" title="Filter Level">
                    <option value="0">All</option>
                    <option value="1">Info+</option>
                    <option value="2">Warnings+</option>
                    <option value="3">Errors Only</option>
                </select>
                <button class="bct-btn-icon" id="btn-clear" title="Clear Console">🗑️</button>
                <button class="bct-btn-icon" id="btn-export" title="Export Log">💾</button>
            </div>
        </div>
        
        <!-- Messages display area -->
        <div class="console-messages" id="console-messages">
            <!-- Messages will be dynamically added here -->
        </div>
        
        <!-- Command input (optional) -->
        <div class="console-input-container">
            <span class="console-prompt">»</span>
            <input type="text" 
                   id="console-input" 
                   class="console-input" 
                   placeholder="Enter command..."
                   autocomplete="off">
        </div>
    </div>

    <script src="../js/bct-common.js"></script>
    <script src="../js/console.js"></script>
</body>
</html>
