<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiocTree BCT Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            overflow: hidden;
        }
        
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #viewer {
            width: 100%;
            height: 100%;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            padding: 20px;
            min-width: 300px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        #ui h1 {
            margin-bottom: 15px;
            font-size: 18px;
            color: #4a90e2;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #cccccc;
        }
        
        .control-group input, .control-group select {
            width: 100%;
            padding: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            color: #ffffff;
            font-size: 12px;
        }
        
        .control-group button {
            width: 100%;
            padding: 10px;
            background: #4a90e2;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }
        
        .control-group button:hover {
            background: #357abd;
        }
        
        .control-group button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            padding: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 11px;
            color: #cccccc;
        }
        
        #info div {
            margin-bottom: 5px;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="viewer"></div>
        
        <div id="ui">
            <h1>🧠 BiocTree BCT Viewer</h1>
            
            <div class="control-group">
                <label>Mesh Type</label>
                <select id="meshType">
                    <option value="brain">Brain Surface</option>
                    <option value="sphere">Sphere</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>Hemisphere</label>
                <select id="hemisphere">
                    <option value="both">Both</option>
                    <option value="left">Left</option>
                    <option value="right">Right</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>BCT Model</label>
                <select id="bctModel">
                    <option value="">Select BCT Model...</option>
                    <option value="fsaverage_bilateral_geodesic.glb">fsaverage Bilateral (Geodesic)</option>
                    <option value="fsaverage_lh_geodesic.glb">fsaverage Left (Geodesic)</option>
                    <option value="fsaverage_rh_geodesic.glb">fsaverage Right (Geodesic)</option>
                    <option value="fsaverage_lh_heat.glb">fsaverage Left (Heat)</option>
                    <option value="fsaverage_rh_heat.glb">fsaverage Right (Heat)</option>
                    <option value="fsaverage_lh_spherical.glb">fsaverage Left (Spherical)</option>
                    <option value="fsaverage_rh_spherical.glb">fsaverage Right (Spherical)</option>
                </select>
            </div>
            
            <div class="control-group">
                <button id="loadModel">Load BCT Model</button>
            </div>
            
            <div class="control-group">
                <label>Point Size</label>
                <input type="range" id="pointSize" min="0.1" max="5" step="0.1" value="1">
                <span id="pointSizeValue">1.0</span>
            </div>
            
            <div class="control-group">
                <button id="clearScene">Clear Scene</button>
            </div>
        </div>
        
        <div id="info">
            <div>Vertices: <span id="vertices">0</span></div>
            <div>Faces: <span id="faces">0</span></div>
            <div>FPS: <span id="fps">0</span></div>
            <div>Status: <span id="status">Ready</span></div>
        </div>
        
        <div id="loading" class="loading" style="display: none;">
            <div>Loading...</div>
        </div>
    </div>
    
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <!-- BCT Viewer -->
    <script src="js/bctViewer.js"></script>
    
    <script>
        // Initialize the BCT viewer
        const viewer = new BCTViewer('viewer');
        
        // UI elements
        const bctModelSelect = document.getElementById('bctModel');
        const loadModelBtn = document.getElementById('loadModel');
        const pointSizeSlider = document.getElementById('pointSize');
        const pointSizeValue = document.getElementById('pointSizeValue');
        const clearSceneBtn = document.getElementById('clearScene');
        const loadingDiv = document.getElementById('loading');
        const statusSpan = document.getElementById('status');
        
        // Load model handler
        loadModelBtn.addEventListener('click', async () => {
            const selectedModel = bctModelSelect.value;
            if (!selectedModel) {
                alert('Please select a BCT model first');
                return;
            }
            
            try {
                loadingDiv.style.display = 'block';
                statusSpan.textContent = 'Loading...';
                
                await viewer.loadBCTGLB(selectedModel);
                
                statusSpan.textContent = 'Model loaded';
                console.log('BCT model loaded successfully:', selectedModel);
            } catch (error) {
                statusSpan.textContent = 'Error loading model';
                alert('Error loading BCT model: ' + error.message);
                console.error('Error loading BCT model:', error);
            } finally {
                loadingDiv.style.display = 'none';
            }
        });
        
        // Point size control
        pointSizeSlider.addEventListener('input', (e) => {
            const size = parseFloat(e.target.value);
            pointSizeValue.textContent = size.toFixed(1);
            viewer.setPointSize(size);
        });
        
        // Clear scene handler
        clearSceneBtn.addEventListener('click', () => {
            viewer.clearScene();
            statusSpan.textContent = 'Scene cleared';
        });
        
        // FPS counter
        let lastTime = performance.now();
        let frameCount = 0;
        
        function updateFPS() {
            frameCount++;
            const currentTime = performance.now();
            if (currentTime - lastTime >= 1000) {
                document.getElementById('fps').textContent = frameCount;
                frameCount = 0;
                lastTime = currentTime;
            }
            requestAnimationFrame(updateFPS);
        }
        updateFPS();
        
        // Load default model on startup
        setTimeout(() => {
            bctModelSelect.value = 'fsaverage_lh_geodesic.glb';
            loadModelBtn.click();
        }, 1000);
    </script>
</body>
</html>
