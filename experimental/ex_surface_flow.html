<!DOCTYPE html>
<html lang="en">
<head>
    <title>Surface Particle Flow - WebGPU Compute</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <style>
        body { margin: 0; overflow: hidden; font-family: monospace; background: #000; }
        canvas { display: block; }
        #info {
            position: absolute; top: 10px; left: 10px; color: #fff;
            background: rgba(0,0,0,0.8); padding: 15px; border-radius: 5px;
            max-width: 400px; font-size: 12px;
        }
        #status {
            position: absolute; bottom: 10px; left: 10px; color: #0f0;
            background: rgba(0,0,0,0.8); padding: 10px; border-radius: 3px; font-size: 11px;
        }
        .title { font-size: 16px; margin-bottom: 10px; color: #0ff; }
        .small { font-size: 10px; opacity: 0.7; margin-top: 8px; }
        button {
            background: #333; color: #0ff; border: 1px solid #0ff;
            padding: 8px 15px; margin: 5px 5px 0 0; border-radius: 3px;
            cursor: pointer; font-family: monospace; font-size: 11px;
}
        button:hover { background: #444; }
    </style>
</head>
<body>
    <div id="info">
        <div class="title">Surface Particle Advection</div>
        <div>Particles flow along heat gradient on cortical surface</div>
        <div class="small">
            • Heat source at pole<br>
            • Particles flow downhill (toward source)<br>
            • Surface-constrained via barycentric coordinates<br>
            • WebGL compute (WebGPU not yet fully supported)
        </div>
        <div style="margin-top: 10px;">
            <button onclick="window.resetParticles()">Reset Particles</button>
            <button onclick="window.toggleFlow()">Pause/Resume</button>
        </div>
    </div>
    <div id="status">Initializing...</div>

    <script type="importmap">
    {
        "imports": {
            "three": "../toolbox/+bct/+ui/+manifold/+viewer/web/vendor/three/build/three.module.js",
            "three/addons/": "../toolbox/+bct/+ui/+manifold/+viewer/web/vendor/three/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let camera, scene, renderer, controls;
        let surfaceMesh, particleSystem;
        let vertices, faces, faceCentroids, faceNormals;
        let heatField, heatGradient; // Per-face heat values and gradients
        let particleData; // {faceIndex, barycentricCoords[3]} for each particle
        let flowActive = true;

        const particleCount = 30000;
        const flowSpeed = 0.5; // Heat gradient flow speed
        const statusEl = document.getElementById('status');

        function updateStatus(msg) {
            console.log(msg);
            statusEl.textContent = msg;
        }

        function loadOBJ(objText) {
            const vertices = [];
            const faces = [];
            const lines = objText.split('\n');

            for (const line of lines) {
                const parts = line.trim().split(/\s+/);
                if (parts[0] === 'v') {
                    vertices.push(
                        parseFloat(parts[1]),
                        parseFloat(parts[2]),
                        parseFloat(parts[3])
                    );
                } else if (parts[0] === 'f') {
                    const f = [];
                    for (let i = 1; i < parts.length; i++) {
                        const idx = parseInt(parts[i].split('/')[0]) - 1;
                        f.push(idx);
                    }
                    if (f.length >= 3) {
                        faces.push(f[0], f[1], f[2]);
                    }
                }
            }

            return { vertices: new Float32Array(vertices), faces: new Uint32Array(faces) };
        }

        function computeFaceData(vertices, faces) {
            const nFaces = faces.length / 3;
            const centroids = new Float32Array(nFaces * 3);
            const normals = new Float32Array(nFaces * 3);

            for (let i = 0; i < nFaces; i++) {
                const i0 = faces[i * 3];
                const i1 = faces[i * 3 + 1];
                const i2 = faces[i * 3 + 2];

                const v0 = [vertices[i0*3], vertices[i0*3+1], vertices[i0*3+2]];
                const v1 = [vertices[i1*3], vertices[i1*3+1], vertices[i1*3+2]];
                const v2 = [vertices[i2*3], vertices[i2*3+1], vertices[i2*3+2]];

                // Centroid
                centroids[i*3]   = (v0[0] + v1[0] + v2[0]) / 3;
                centroids[i*3+1] = (v0[1] + v1[1] + v2[1]) / 3;
                centroids[i*3+2] = (v0[2] + v1[2] + v2[2]) / 3;

                // Normal (cross product)
                const e1 = [v1[0]-v0[0], v1[1]-v0[1], v1[2]-v0[2]];
                const e2 = [v2[0]-v0[0], v2[1]-v0[1], v2[2]-v0[2]];
                const n = [
                    e1[1]*e2[2] - e1[2]*e2[1],
                    e1[2]*e2[0] - e1[0]*e2[2],
                    e1[0]*e2[1] - e1[1]*e2[0]
                ];
                const len = Math.sqrt(n[0]*n[0] + n[1]*n[1] + n[2]*n[2]);
                normals[i*3]   = n[0] / len;
                normals[i*3+1] = n[1] / len;
                normals[i*3+2] = n[2] / len;
            }

            return { centroids, normals };
        }

        function computeHeatField(vertices, faces, centroids) {
            const nFaces = faces.length / 3;
            const heat = new Float32Array(nFaces);
            const gradient = new Float32Array(nFaces * 3);

            // Source at "north pole" (max Z)
            let maxZ = -Infinity;
            for (let i = 0; i < vertices.length; i += 3) {
                maxZ = Math.max(maxZ, vertices[i + 2]);
            }

            // Compute distance from pole for each face
            for (let i = 0; i < nFaces; i++) {
                const cx = centroids[i*3];
                const cy = centroids[i*3+1];
                const cz = centroids[i*3+2];
                
                const dist = Math.sqrt(cx*cx + cy*cy + (cz - maxZ)*(cz - maxZ));
                heat[i] = Math.exp(-dist / 10); // Exponential decay
            }

            // Compute gradient (simple finite difference)
            // For proper gradient, should use DEC operators
            // For now, approximate with neighboring faces
            for (let i = 0; i < nFaces; i++) {
                // Gradient points "downhill" (toward higher heat)
                // Approximate: gradient in direction of max heat increase
                gradient[i*3]   = 0;
                gradient[i*3+1] = 0;
                gradient[i*3+2] = maxZ - centroids[i*3+2]; // Vertical component toward pole
                
                // Normalize
                const len = Math.sqrt(
                    gradient[i*3]*gradient[i*3] +
                    gradient[i*3+1]*gradient[i*3+1] +
                    gradient[i*3+2]*gradient[i*3+2]
                );
                if (len > 0) {
                    gradient[i*3] /= len;
                    gradient[i*3+1] /= len;
                    gradient[i*3+2] /= len;
                }
            }

            return { heat, gradient };
        }

        async function init() {
            updateStatus('Loading mesh...');

            // Load OBJ
            const response = await fetch('../data/mesh/fsaverage5.obj');
            const objText = await response.text();
            const meshData = loadOBJ(objText);
            
            vertices = meshData.vertices;
            faces = meshData.faces;

            updateStatus(`Loaded: ${vertices.length/3} vertices, ${faces.length/3} faces`);

            // Compute face data
            const faceData = computeFaceData(vertices, faces);
            faceCentroids = faceData.centroids;
            faceNormals = faceData.normals;

            // Compute heat field
            updateStatus('Computing heat field...');
            const heatData = computeHeatField(vertices, faces, faceCentroids);
            heatField = heatData.heat;
            heatGradient = heatData.gradient;

            // Setup Three.js
            updateStatus('Setting up renderer...');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 180);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 10, 10);
            scene.add(dirLight);

            // Create surface mesh
            createSurfaceMesh();

            // Create particles
            initializeParticles();

            window.addEventListener('resize', onWindowResize);

            updateStatus('Ready');
            animate();
        }

        function createSurfaceMesh() {
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            geometry.setIndex(new THREE.BufferAttribute(faces, 1));
            
            // Color by heat field
            const nVertices = vertices.length / 3;
            const colors = new Float32Array(nVertices * 3);
            
            // Average heat from adjacent faces
            const vertexHeat = new Float32Array(nVertices);
            const vertexCount = new Int32Array(nVertices);
            
            for (let i = 0; i < faces.length; i += 3) {
                const faceIdx = i / 3;
                const heat = heatField[faceIdx];
                for (let j = 0; j < 3; j++) {
                    const vIdx = faces[i + j];
                    vertexHeat[vIdx] += heat;
                    vertexCount[vIdx]++;
                }
            }
            
            for (let i = 0; i < nVertices; i++) {
                if (vertexCount[i] > 0) {
                    vertexHeat[i] /= vertexCount[i];
                }
                const h = vertexHeat[i];
                colors[i*3]   = h;
                colors[i*3+1] = 0.3 * h;
                colors[i*3+2] = 1 - h;
            }
            
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.computeVertexNormals();

            const material = new THREE.MeshStandardMaterial({
                vertexColors: true,
                roughness: 0.6,
                metalness: 0.2,
                side: THREE.DoubleSide
            });

            surfaceMesh = new THREE.Mesh(geometry, material);
            scene.add(surfaceMesh);
        }

        function initializeParticles() {
            // Each particle: faceIndex, barycentric coords (u, v, w)
            const nFaces = faces.length / 3;
            particleData = [];
            
            for (let i = 0; i < particleCount; i++) {
                const faceIdx = Math.floor(Math.random() * nFaces);
                // Random barycentric coords
                let u = Math.random();
                let v = Math.random() * (1 - u);
                let w = 1 - u - v;
                
                particleData.push({ faceIdx, bary: [u, v, w] });
            }

            // Create particle positions from barycentric coords
            updateParticlePositions();
        }

        function updateParticlePositions() {
            const positions = new Float32Array(particleCount * 3);
            
            for (let i = 0; i < particleCount; i++) {
                const { faceIdx, bary } = particleData[i];
                const i0 = faces[faceIdx * 3];
                const i1 = faces[faceIdx * 3 + 1];
                const i2 = faces[faceIdx * 3 + 2];

                const v0 = [vertices[i0*3], vertices[i0*3+1], vertices[i0*3+2]];
                const v1 = [vertices[i1*3], vertices[i1*3+1], vertices[i1*3+2]];
                const v2 = [vertices[i2*3], vertices[i2*3+1], vertices[i2*3+2]];

                positions[i*3]   = bary[0]*v0[0] + bary[1]*v1[0] + bary[2]*v2[0];
                positions[i*3+1] = bary[0]*v0[1] + bary[1]*v1[1] + bary[2]*v2[1];
                positions[i*3+2] = bary[0]*v0[2] + bary[1]*v1[2] + bary[2]*v2[2];
            }

            if (!particleSystem) {
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

                const material = new THREE.PointsMaterial({
                    color: 0x00ffff,
                    size: 0.4,
                    transparent: true,
                    opacity: 0.9,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });

                particleSystem = new THREE.Points(geometry, material);
                scene.add(particleSystem);
            } else {
                particleSystem.geometry.attributes.position.array.set(positions);
                particleSystem.geometry.attributes.position.needsUpdate = true;
            }
        }

        function advectParticles(deltaTime) {
            if (!flowActive) return;

            const dt = deltaTime * flowSpeed;

            for (let i = 0; i < particleCount; i++) {
                const particle = particleData[i];
                const faceIdx = particle.faceIdx;

                // Get heat gradient for this face (tangent to surface)
                const grad = [
                    heatGradient[faceIdx*3],
                    heatGradient[faceIdx*3+1],
                    heatGradient[faceIdx*3+2]
                ];

                // Project gradient to tangent plane (remove normal component)
                const normal = [
                    faceNormals[faceIdx*3],
                    faceNormals[faceIdx*3+1],
                    faceNormals[faceIdx*3+2]
                ];

                const dot = grad[0]*normal[0] + grad[1]*normal[1] + grad[2]*normal[2];
                const tangentGrad = [
                    grad[0] - dot*normal[0],
                    grad[1] - dot*normal[1],
                    grad[2] - dot*normal[2]
                ];

                // Move particle in barycentric space
                // This is simplified - proper implementation needs face basis vectors
                // For now, just perturb barycentric coords
                let [u, v, w] = particle.bary;
                
                // Random walk with bias toward heat gradient
                u += (Math.random() - 0.5) * 0.01 + tangentGrad[0] * dt * 0.001;
                v += (Math.random() - 0.5) * 0.01 + tangentGrad[1] * dt * 0.001;
                w = 1 - u - v;

                // Clamp to valid barycentric coordinates
                u = Math.max(0, Math.min(1, u));
                v = Math.max(0, Math.min(1 - u, v));
                w = 1 - u - v;

                // If particle leaves triangle, find new face (simplified - randomly pick nearby face)
                if (u < 0 || v < 0 || w < 0) {
                    const nFaces = faces.length / 3;
                    particle.faceIdx = Math.floor(Math.random() * nFaces);
                    u = Math.random();
                    v = Math.random() * (1 - u);
                    w = 1 - u - v;
                }

                particle.bary = [u, v, w];
            }

            updateParticlePositions();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        let lastTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);

            const currentTime = performance.now();
            const deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            advectParticles(deltaTime);

            controls.update();
            renderer.render(scene, camera);
        }

        // Global functions for buttons
        window.resetParticles = function() {
            initializeParticles();
            updateStatus('Particles reset');
        };

        window.toggleFlow = function() {
            flowActive = !flowActive;
            updateStatus(flowActive ? 'Flow resumed' : 'Flow paused');
        };

        // Start
        init().catch(error => {
            updateStatus(`Error: ${error.message}`);
            console.error(error);
        });

    </script>
</body>
</html>
