<!DOCTYPE html>
<html lang="en">
<head>
    <title>Surface Particle Flow - WebGPU</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: monospace;
            background: #000;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 5px;
            max-width: 300px;
            font-size: 12px;
        }
        #status {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #0f0;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border-radius: 3px;
            font-size: 11px;
        }
        .title { font-size: 16px; margin-bottom: 10px; color: #0ff; }
        .small { font-size: 10px; opacity: 0.7; }
    </style>
</head>
<body>
    <div id="info">
        <div class="title">Surface Particle Flow</div>
        <div>WebGPU compute shader advecting particles along mesh surface gradient</div>
        <div class="small" style="margin-top: 10px;">
            • Particles follow heat field gradient<br>
            • Stay constrained to surface<br>
            • Uses geometry-processing-js
        </div>
    </div>
    <div id="status">Loading...</div>

    <script type="importmap">
    {
        "imports": {
            "three": "../toolbox/+bct/+ui/+manifold/+viewer/web/vendor/three/build/three.module.js",
            "three/addons/": "../toolbox/+bct/+ui/+manifold/+viewer/web/vendor/three/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Import geometry-processing-js components
        const gpjsPath = '../external/geometry-processing-js';
        
        // Dynamically import geometry-processing-js modules
        const Mesh = (await import(`${gpjsPath}/core/mesh.js`)).default;
        const Geometry = (await import(`${gpjsPath}/core/geometry.js`)).default;
        const MeshIO = (await import(`${gpjsPath}/utils/meshio.js`)).default;
        const DEC = (await import(`${gpjsPath}/core/discrete-exterior-calculus.js`)).default;

        let camera, scene, renderer, controls;
        let surfaceMesh, particleSystem;
        let meshGeometry, meshTopology; // geometry-processing-js objects
        let computeShader, particleBuffer;

        const particleCount = 50000;
        const statusEl = document.getElementById('status');

        function updateStatus(msg) {
            console.log(msg);
            statusEl.textContent = msg;
        }

        async function init() {
            updateStatus('Initializing WebGPU...');

            // Setup scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);

            // Camera
            camera = new THREE.PerspectiveCamera(
                45,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 0, 150);

            // Renderer (try WebGL fallback if WebGPU fails)
            try {
                renderer = new THREE.WebGLRenderer({ antialias: true });
            } catch (e) {
                updateStatus('WebGPU not available, using WebGL');
                renderer = new THREE.WebGLRenderer({ antialias: true });
            }
            
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 10, 10);
            scene.add(directionalLight);

            // Load mesh
            await loadMesh();

            // Setup particles
            setupParticles();

            // Event listeners
            window.addEventListener('resize', onWindowResize);

            // Start animation
            animate();
        }

        async function loadMesh() {
            updateStatus('Loading mesh...');

            try {
                // Load OBJ file
                const response = await fetch('../data/mesh/fsaverage5.obj');
                const objText = await response.text();

                updateStatus('Parsing mesh with geometry-processing-js...');

                // Parse with geometry-processing-js
                const meshData = MeshIO.readOBJ(objText);
                meshTopology = new Mesh();
                meshTopology.build(meshData);
                meshGeometry = new Geometry(meshTopology, meshData.v, false);

                updateStatus(`Mesh loaded: ${meshTopology.vertices.length} vertices, ${meshTopology.faces.length} faces`);

                // Compute heat field (simple distance from vertex 0 as source)
                updateStatus('Computing heat field...');
                const heatField = computeHeatField(meshTopology, meshGeometry);

                // Create Three.js mesh for visualization
                createThreeMesh(meshData, heatField);

                updateStatus('Mesh ready');

            } catch (error) {
                updateStatus(`Error loading mesh: ${error.message}`);
                console.error(error);
            }
        }

        function computeHeatField(mesh, geometry) {
            // Simple heat diffusion from a source vertex
            // For now, use Euclidean distance as a proxy
            // TODO: Use actual heat kernel from geometry-processing-js
            
            const nV = mesh.vertices.length;
            const heatValues = new Float32Array(nV);
            
            // Source at first vertex
            const sourceIdx = 0;
            const sourcePos = geometry.positions[sourceIdx];

            // Compute distances
            let maxDist = 0;
            for (let i = 0; i < nV; i++) {
                const pos = geometry.positions[i];
                const dx = pos.x - sourcePos.x;
                const dy = pos.y - sourcePos.y;
                const dz = pos.z - sourcePos.z;
                const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
                heatValues[i] = dist;
                maxDist = Math.max(maxDist, dist);
            }

            // Normalize
            for (let i = 0; i < nV; i++) {
                heatValues[i] /= maxDist;
            }

            return heatValues;
        }

        function createThreeMesh(meshData, heatField) {
            // Convert to Three.js geometry
            const vertices = meshData.v;
            const faces = [];
            
            // Extract face indices
            for (const faceData of meshData.f) {
                if (faceData.length >= 3) {
                    faces.push(faceData[0], faceData[1], faceData[2]);
                }
            }

            // Create BufferGeometry
            const geometry = new THREE.BufferGeometry();
            
            const positions = new Float32Array(vertices.length * 3);
            const colors = new Float32Array(vertices.length * 3);
            
            for (let i = 0; i < vertices.length; i++) {
                positions[i * 3] = vertices[i].x;
                positions[i * 3 + 1] = vertices[i].y;
                positions[i * 3 + 2] = vertices[i].z;
                
                // Color based on heat field
                const heat = heatField[i];
                colors[i * 3] = heat;
                colors[i * 3 + 1] = 0.2;
                colors[i * 3 + 2] = 1 - heat;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setIndex(faces);
            geometry.computeVertexNormals();

            // Create material
            const material = new THREE.MeshStandardMaterial({
                vertexColors: true,
                roughness: 0.7,
                metalness: 0.1,
                side: THREE.DoubleSide
            });

            // Create mesh
            surfaceMesh = new THREE.Mesh(geometry, material);
            scene.add(surfaceMesh);
        }

        function setupParticles() {
            updateStatus('Setting up particles...');

            // For now, use simple Point particles (WebGL)
            // TODO: Implement WebGPU compute shader for surface advection
            
            const vertices = surfaceMesh.geometry.attributes.position.array;
            const nVertices = vertices.length / 3;
            
            // Randomly distribute particles on mesh vertices
            const particlePositions = new Float32Array(particleCount * 3);
            
            for (let i = 0; i < particleCount; i++) {
                const vIdx = Math.floor(Math.random() * nVertices);
                particlePositions[i * 3] = vertices[vIdx * 3];
                particlePositions[i * 3 + 1] = vertices[vIdx * 3 + 1];
                particlePositions[i * 3 + 2] = vertices[vIdx * 3 + 2];
            }

            // Create particle geometry
            const particleGeometry = new THREE.BufferGeometry();
            particleGeometry.setAttribute('position', 
                new THREE.BufferAttribute(particlePositions, 3));

            // Create particle material
            const particleMaterial = new THREE.PointsMaterial({
                color: 0x00ffff,
                size: 0.3,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            // Create particle system
            particleSystem = new THREE.Points(particleGeometry, particleMaterial);
            scene.add(particleSystem);

            updateStatus(`Particles ready (${particleCount} particles)`);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            controls.update();

            // TODO: Execute WebGPU compute shader for particle advection
            // For now, particles are static

            renderer.render(scene, camera);
        }

        // Start
        init().catch(error => {
            updateStatus(`Fatal error: ${error.message}`);
            console.error(error);
        });

    </script>
</body>
</html>
